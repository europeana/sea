allowBuilds:
  "@parcel/watcher": true
  esbuild: true
  msgpackr-extract: true
  msw: true
  nx: true
  unrs-resolver: true
catalog:
  "@europeana/style": "2.39.6"
  bootstrap: "5.3.9"
  content-disposition: "3.1.0"
  lodash-es: "4.18.1"
  node-fetch-native: "1.6.7"
  ol: "10.11.0"
  readable-stream: 4.8.0
  rimraf: 6.1.4
catalogs:
  contentful:
    "@contentful/app-sdk": 5.2.0
    contentful-management: 12.21.0
  eslint10:
    "@eslint/compat": "2.1.1"
    "@eslint/css": "1.4.0"
    "@eslint/js": "10.0.1"
    "@eslint/json": "2.1.1"
    "@nuxt/eslint": "1.16.0"
    eslint: "10.15.0"
    "eslint-config-prettier": "10.1.8"
    "eslint-plugin-vue": "10.12.1"
    "typescript-eslint": "8.74.0"
  html:
    marked: "18.3.0"
    node-html-parser: "9.0.7"
    turndown: "7.2.5"
  nitro2:
    h3: "1.15.11"
    morgan: "1.12.1"
    nitropack: "2.14.0"
  nuxt3:
    "@nuxt/test-utils": 3.23.0
    "@nuxtjs/i18n": 9.5.6
    "@nuxtjs/storybook": 10.0.4
    nuxt: 3.21.11
  rollup4:
    "@rollup/plugin-node-resolve": 16.0.3
    "@rollup/plugin-terser": "1.0.2"
    "@rollup/plugin-typescript": "12.3.1"
    rollup: 4.68.8
  typescript5:
    typescript: 5.9.3
  types:
    "@types/morgan": "1.9.10"
    "@types/node": 26.6.10
    "@types/readable-stream": 4.0.25
    "@types/turndown": "5.0.6"
  vite7:
    "@vitejs/plugin-vue": "6.0.11"
    vite: "8.3.8"
    "vite-tsconfig-paths": "6.1.1"
  vitest4:
    "@vitest/coverage-v8": "4.1.12"
    vitest: "4.1.12"
  vue3:
    vue: "3.5.46"
    "@vue/test-utils": "2.6.0"
    "@vueuse/core": "15.1.0"
minimumReleaseAgeExclude:
  - "@europeana/style"
  - "@europeana/feedback-widget@0.5.6"
  - rimraf@6.1.4
packages:
  - apps/*
  - libs/*
