#import "../fragments/imageFields.graphql"

query EventsListing(
  $locale: String!
  $preview: Boolean = false
  $limit: Int!
  $skip: Int = 0
  $excludeSysIds: [String] = []
  $categoriesFilter: [EventFilter]
  $tagsFilter: [EventFilter]
  $query: String = ""
) {
  eventCollection(
    preview: $preview
    locale: $locale
    order: [startDate_DESC, datePublished_DESC]
    limit: $limit
    skip: $skip
    where: {
      AND: [
        { sys: { id_not_in: $excludeSysIds } }
        { name_contains: $query }
        {
          contentfulMetadata: {
            concepts_exists: true
            concepts: { id_contains_some: ["eventTypeEvent"] }
          }
        }
        { AND: $categoriesFilter }
        { AND: $tagsFilter }
      ]
    }
  ) {
    total
    ...eventCollectionFields
  }
}

fragment eventCollectionFields on EventCollection {
  items {
    __typename
    contentfulMetadata {
      concepts {
        id
      }
    }
    sys {
      id
    }
    url
    name
    image {
      ...imageFields
    }
    startDate
    endDate
    datePublished
  }
}
