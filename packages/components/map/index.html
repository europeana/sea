<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Europeana Map</title>
  </head>
  <body>
    <style>
      body {
        margin: 0;
      }
      #europeana-map {
        width: 100vw;
        height: 100vh;
      }
    </style>
    <div id="europeana-map" />
    <div
      id="popover"
      style="background-color: white; padding: 1rem; margin: 0.2rem"
    >
      Popover content
    </div>
    <script type="module">
      import { EuropeanaMapWrapper } from "./src/index.js";

      new EuropeanaMapWrapper("#europeana-map", {
        // Uncomment for single feature testing
        // json: JSON.stringify({ features: [{type:'Feature',id:'http://data.europeana.eu/organization/1',geometry:{type:'Point',coordinates:[18.2924425,57.6396512]}}]}),
        url: "https://www.europeana.eu/_api/collections/organisations/geo",
        hash: true,
        pinPopover: document.getElementById("popover"),
        controls: {
          fullscreen: {},
          zoom: {},
          attribution: { collapsible: true },
        },
        // Map styles
        //
        // OpenStreetmap (default)
        // style: "openstreetmap",
        //
        // Protomaps -- from @europeana/map-styles via jsdelivr; latest version; localised English lang version
        // style: ["protomaps", { locale: "en" }],
        //
        // Versatiles -- from @europeana/map-styles via jsdelivr; latest version; native lang version
        style: "versatiles",
        //
        // Versatiles -- from @europeana/map-styles via jsdelivr; version 0.1.13; localised English lang version
        // style: ["versatiles", { locale: "en", version: "0.1.13" }],
        //
        // Other Mapbox StyleJSON URL
        // style: "https://tiles.openfreemap.org/styles/liberty",
      });
    </script>
  </body>
</html>
